name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: homefinder
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d homefinder"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/homefinder
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SUPABASE_JWT_ISSUER_URI: ${{ secrets.SUPABASE_JWT_ISSUER_URI }}
          SUPABASE_JWT_JWK_SET_URI: ${{ secrets.SUPABASE_JWT_JWK_SET_URI }}
          LOGGING_LEVEL_ORG_FLYWAYDB: INFO
          LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build

      - name: Run frontend tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: npm test -- --watchAll=false
  
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: homematch_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d homematch_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Backend setup
      # -------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build backend (skip tests)
        working-directory: backend
        run: ./mvnw -B clean package -Dmaven.test.skip=true

      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: e2e
          SUPABASE_JWT_ISSUER_URI: ${{ secrets.SUPABASE_JWT_ISSUER_URI }}
          SUPABASE_JWT_JWK_SET_URI: ${{ secrets.SUPABASE_JWT_JWK_SET_URI }}
        run: |
          java -jar target/*.jar &
          echo "Waiting for backend..."
          until curl -s http://localhost:8081/actuator/health > /dev/null; do
            sleep 2
          done

      # -------------------------
      # Frontend + Playwright
      # -------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run e2e tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8081
          E2E_AUTH_EMAIL_ONE: ${{ secrets.E2E_AUTH_EMAIL_ONE }}
          E2E_AUTH_PASSWORD_ONE: ${{ secrets.E2E_AUTH_PASSWORD_ONE }}
          E2E_AUTH_EMAIL_TWO: ${{ secrets.E2E_AUTH_EMAIL_TWO }}
          E2E_AUTH_PASSWORD_TWO: ${{ secrets.E2E_AUTH_PASSWORD_TWO }}
        run: npm run test:e2e

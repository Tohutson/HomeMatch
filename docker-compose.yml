services:
  postgres:
    image: postgres:18.2-bookworm
    container_name: homefinder-db
    environment:
      POSTGRES_DB: homefinder
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
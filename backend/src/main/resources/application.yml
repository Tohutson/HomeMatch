spring:
  application:
    name: homematch

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../frontend/.env.local[.properties]

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER_URI:${SUPABASE_URL:https://bwreiezwxlaqnvegpuas.supabase.co}/auth/v1}
          jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:${SUPABASE_URL:https://bwreiezwxlaqnvegpuas.supabase.co}/auth/v1/.well-known/jwks.json}

app:
  supabase:
    url: ${SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL:}}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  security:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://10.0.0.207:3000
    jwt:
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    rate-limit:
      window: 1m
      public-requests-per-window: 120
      suggestion-requests-per-window: 30
      authenticated-write-requests-per-window: 60

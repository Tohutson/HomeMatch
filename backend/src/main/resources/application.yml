spring:
  application:
    name: homematch

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER_URI}
          jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:${SUPABASE_JWT_ISSUER_URI}/.well-known/jwks.json}
